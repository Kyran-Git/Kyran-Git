    <circle cx="1160" cy="45" r="2"/><circle cx="800" cy="245" r="2"/>
  </g>
  <circle cx="1040" cy="150" r="47" fill="url(#accent)"/>
  <g font-family="Segoe UI, Arial, sans-serif">
    <text x="64" y="74" fill="#67e8f9" font-size="18" letter-spacing="5">WELCOME TO MY CORNER OF GITHUB</text>
    <text x="60" y="155" fill="#ffffff" font-size="70" font-weight="700">Sean / Kyran-Git</text>
    <text x="64" y="206" fill="#e0e7ff" font-size="24">Code, curiosity, and a universe of possibilities.</text>
    <text x="64" y="260" fill="#f9a8d4" font-size="18" letter-spacing="4">AI · APPS · GAMES · BEYOND</text>
