  <defs>
    <linearGradient id="bg" x2="1" y2="1">
      <stop stop-color="#10152f"/>
      <stop offset=".55" stop-color="#35216b"/>
      <stop offset="1" stop-color="#0b536b"/>
    </linearGradient>
    <linearGradient id="accent">
      <stop stop-color="#22d3ee"/>
      <stop offset=".5" stop-color="#c084fc"/>
      <stop offset="1" stop-color="#fb7185"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="340" rx="24" fill="url(#bg)"/>
  <g fill="none" stroke="#a5b4fc" opacity=".2">
